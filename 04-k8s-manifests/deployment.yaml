apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-classifier
  namespace: ml-ops
  labels:
    app: intent-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intent-classifier
  template:
    metadata:
      labels:
        app: intent-classifier
    spec:
      serviceAccountName: ml-ops-sa
      containers:
        - name: intent-classifier
          image: <Image-URL:Tag>
          imagePullPolicy: Always
          ports:
            - containerPort: 6000
